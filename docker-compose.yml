version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: intellicivic-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: intellicivic
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d intellicivic"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Future service fallback (commented for future use)
  # redis:
  #   image: redis:7-alpine
  #   container_name: intellicivic-redis
  #   restart: always
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis_data:/data

volumes:
  postgres_data:
  # redis_data:
